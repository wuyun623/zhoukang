name: 刷课
 
on: 
  push:
    branches: [ main ]
  #是否开始每天8点定时刷课，若要开启请把下面两行注释去掉
  #schedule:
  #  - cron: "0 8 * * *" 
    
jobs: 
  Start:
    runs-on: ubuntu-latest # 在最新版本的 Ubuntu 操作系统环境下运行
    steps: # 要执行的步骤
      - name: 拷贝代码
        uses: actions/checkout@v4  # 用于将github代码仓库的代码拷贝到工作目录中
 
      - name: 设置python环境
        uses: actions/setup-python@v5 # 用于设置 Python 环境，它允许你指定要在工作环境中使用的 Python 版本
        with:
          python-version: '3.13'  # 选择要用的Python版本
 
      - name: 安装依赖包
        run: | # 安装依赖包
          pip install -r ./requirements.txt 
          
      
      - name: Run main.py
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
        run: python main.py -u "13836259439" -p "abcd200806" -l "https://mooc1.hlju.edu.cn/mycourse/studentstudy?chapterId=1279501762&courseId=266940760&clazzid=154279306&cpi=578779875&enc=5eff468b7661037c44f2ac2bf45b8d53&mooc2=1&hidetype=0&fanyaVersion=0&openc=0250344f46f6d0e5063e0d279d3c2032"
